name: Update contribution runner
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/contribution_runner.py'
      - 'assets/runner/**'
      - 'requirements.txt'
      - '.github/workflows/contribution-runner.yml'
permissions:
  contents: write
concurrency:
  group: contribution-runner
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/contribution_runner.py --fetch
      - name: Save updated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-runner.gif assets/contribution-runner.png data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution runner animation'
            git push origin HEAD:main
          fi
