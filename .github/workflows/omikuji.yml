name: Omikuji

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Each run drains all open requests, including ones whose pending run was replaced.
concurrency:
  group: omikuji
  cancel-in-progress: false

jobs:
  draw:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[OMIKUJI]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test lottery
        run: python3 -m unittest discover -s tests -v
      - name: Draw, save and reply
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/omikuji.py
