name: 🎋 おみくじを引く
description: 今日の開発運を占い、プロフィールに参拝記録を残します。
title: "[OMIKUJI] 今日のおみくじ"
body:
  - type: markdown
    attributes:
      value: |
        ## ⛩️ ようこそ
        投稿後、GitHub Actionsが抽選してこのIssueに結果を返信します。
        日本時間で1日1運勢。同日の再参拝では同じ結果をお届けします。
        結果が届くまでIssueを開いたままお待ちください。
  - type: checkboxes
    id: consent
    attributes:
      label: 参拝の確認
      options:
        - label: ユーザー名と抽選結果が公開記録に残ることを確認して、おみくじを引きます。
          required: true
